<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ school.name }} | Reset Password
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --navy: #0d3155;
            --navy-light: #153d65;
            --gold: #f4b73b;
            --cream: #faf9f5;
            --white: #ffffff;
            --text: #0c2947;
            --muted: #66758a;
            --border: #dedbd3;
            --input-border: #d8d5ce;
            --success: #0e6b6f;
            --error: #b3261e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }

        body {
            font-family: "Inter", sans-serif;
            background: var(--cream);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        a { text-decoration: none; }
        button, input { font-family: inherit; }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 36px 32px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
        }

        .card h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card p.subtitle {
            color: var(--muted);
            font-size: 13.5px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            background: #fbeceb;
            color: var(--error);
            border: 1px solid #f3c9c6;
        }

        .message.success {
            background: #e9f5f4;
            color: var(--success);
            border-color: #bfe1de;
        }

        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid var(--input-border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
        }

        .input:focus {
            outline: none;
            border-color: var(--navy-light);
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--navy);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-button:hover { background: var(--navy-light); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--navy);
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="card">

        <h2>Reset your password</h2>
        <p class="subtitle">
            Enter the email on your account and we'll send you a link
            to reset your password.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/forgot-password">

            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input
                    class="input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" class="submit-button">
                Send reset link
            </button>

        </form>

        <a href="/signin" class="back-link">← Back to sign in</a>

    </div>

</body>
</html>
